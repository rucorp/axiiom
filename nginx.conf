# AXIIOM static hosting (nginx:alpine, see Dockerfile)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/xml;
    gzip_min_length 1024;

    # Кастомная страница 404 вместо стандартной заглушки nginx
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Версионированная статика (?v=YYYYMMDD через build.py) — можно кэшировать долго
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public" always;
    }
}
