changelog:
  exclude:
    labels:
      - "skip-changelog"
  categories:
    - title: Features
      labels:
        - "feat"
        - "feature"
    - title: Bug Fixes
      labels:
        - "fix"
        - "bug"
    - title: Documentation
      labels:
        - "docs"
        - "documentation"
    - title: Maintenance
      labels:
        - "chore"
        - "maintenance"
        - "build"
